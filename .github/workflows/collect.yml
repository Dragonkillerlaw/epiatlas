name: Collect official reports
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: report-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect reports and record source health
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Check data rules
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Save updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official outbreak reports"
            git pull --rebase origin main
            git push
          fi
      - name: Fail visibly if all sources failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
